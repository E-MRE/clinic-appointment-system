name: clinic_appointment_system
description: "Hospital and clinic appointment management (BSM515 term project)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  intl: ^0.20.2
  get_it: ^9.3.0
  go_router: ^17.5.0
  flutter_bloc: ^9.1.1
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf

  assets:
    - assets/translations/
