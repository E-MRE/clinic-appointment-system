name: Merge attribution audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Reject prohibited commit trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pushed history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject Co-Authored-By trailers
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          if printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            commits="$PUSH_SHA"
          else
            commits=$(git rev-list "$PUSH_BEFORE..$PUSH_SHA")
          fi
          for commit in $commits; do
            if git show --no-patch --format=%B "$commit" | grep -Eiq '(^|[[:space:]])co-authored-by:'; then
              echo '::error::The pushed commit contains a prohibited Co-Authored-By trailer.'
              exit 1
            fi
          done
          echo 'PASS: pushed commits contain no Co-Authored-By trailer.'
