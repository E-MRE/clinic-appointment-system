name: Bug report
description: Report a reproducible problem
title: "bug: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove credentials, access
        tokens, and other private information from logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were trying to do.
      placeholder: Tell us what you observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: project-version
    attributes:
      label: Project version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your browser and version, user role, and Flutter version.
      placeholder: |
        Browser: Chrome 129
        User role: Patient / Doctor / Admin
        Flutter: 3.x.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only redacted, relevant output. Do not include secrets or tokens.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include anything else that may affect the issue.
